[project]
name = "yt-song-scrap"
version = "0.1.0"
description = "YouTube piano cover pipeline: download, transcribe, separate, upload"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "soundfile>=0.12.0",
]

[dependency-groups]
gpu = [
    "yt-dlp>=2024.1.0",
    "librosa>=0.10.0",
    "openai>=1.30.0",
    "piano-transcription-inference>=0.0.6",
    "audio-separator[gpu]>=0.17.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "boto3>=1.34.0",
]

[tool.uv]
package = false
